<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Visitas</title>
    <!-- Bootstrap 5 (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="card p-4">
        <div class="text-center">
            <div class="display-1 text-primary"><i class="bi bi-eye-fill"></i></div>
            <h1 class="h3 mt-2">Contador de Visitas</h1>
            <p class="text-muted">Seguimiento mediante <strong>session</strong> Flask</p>

            <div class="contador">{{ visitas }}</div>
            <p class="mb-1">Has visitado esta página <strong>{{ visitas }}</strong> veces.</p>
            <p class="reinicios"><i class="bi bi-arrow-repeat"></i> Reinicios: <strong>{{ reinicios }}</strong></p>

            <div class="d-grid gap-2 mt-3">
                <a href="{{ url_for('incrementar2') }}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> +2 visitas
                </a>
                <a href="{{ url_for('reiniciar') }}" class="btn btn-danger">
                    <i class="bi bi-arrow-counterclockwise"></i> Reiniciar a 0
                </a>
                <a href="{{ url_for('destroy') }}" class="btn btn-secondary">
                    <i class="bi bi-trash"></i> Destruir sesión
                </a>
            </div>

            <hr class="my-3">

            <!-- Formulario: envía por POST a /procesar_aumento -->
            <form action="{{ url_for('procesar_aumento') }}" method="post">
                <div class="row g-2 align-items-center justify-content-center">
                    <div class="col-auto">
                        <label for="num" class="col-form-label">Aumentar en:</label>
                    </div>
                    <div class="col-auto">
                        <input type="number" name="num" id="num" class="form-control" min="1" value="1" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-info text-white">
                            <i class="bi bi-plus-lg"></i> Aumentar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
